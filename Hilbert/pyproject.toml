[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hilbert"
version = "1.0.0"
description = "David Hilbert: Grundlagen der Geometrie, Hilbert Space Spectral Theory, and 23 Problems"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Jeong Hoon Kim" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
hilbert = "hilbert.cli:main"
