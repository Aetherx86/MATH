[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heisenberg"
version = "1.0.0"
description = "Werner Heisenberg: Matrix Mechanics, Canonical Commutators, and Uncertainty Principle Engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Jeong Hoon Kim" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
heisenberg = "heisenberg.cli:main"
